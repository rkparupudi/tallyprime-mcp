[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tallyprime-mcp"
version = "0.1.0"
description = "Read-only MCP server that lets Claude query the books in a locally running TallyPrime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=1.2", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
tallyprime-mcp = "tallyprime_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tallyprime_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
